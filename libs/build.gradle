plugins {
     id 'com.android.library'
     id 'maven-publish' // Add this
}

def srcDirs = [
    'io/github/debanikita/button',
    'io/github/debanikita/toast',
    'io/github/debanikita/magicindicator',
]

android {
    namespace 'io.github.debanikita'
    compileSdk 30
    
    sourceSets {
        main {
            manifest.srcFile 'java/io/github/debanikita/AndroidManifest.xml'
            java.srcDir 'java'
            java.includes = srcDirs.collect { it + '/**/*.java' }
            java.excludes = [
                '**/build/**'
            ]
            
            srcDirs.each {
                res.srcDirs 'java/' + it + '/res', 'java/' + it + '/res-public'
            }
        }
    }
    
    defaultConfig {
        minSdk 21
    }
    
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles(
                getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro'
            )
        }
    }
/*
    publishing {
        singleVariant('release') {
            withSourcesJar()
            withJavadocJar()
        }
    }
    */
}

dependencies {
    // Core Android dependencies
    implementation 'androidx.appcompat:appcompat:1.0.0'
    
    // Add your module-specific dependencies here
    // Note: Avoid including UI dependencies like Material Design
    // Let the main app module provide those dependencies
}

task getVersion {
    doLast {
        println version
    }
}

task androidSourcesJar(type: Jar) {
    archiveClassifier = 'sources'
    from(android.sourceSets.main.java.srcDirs) {
        // Needed because we have Java sources and resources in same directory
        include '**/*.java'
        includeEmptyDirs = false
    }
}

// After your 'android {}' block
afterEvaluate {
    publishing {
        publications {
            // Name your publication (e.g., 'release')
            release(MavenPublication) {
                // Use the 'release' component from the Android plugin
                from components.release

                // Define your coordinates (what developers will use to import)
                groupId = 'io.github.debanikita' // e.g., 'com.example.library'
                artifactId = 'library' // e.g., 'awesome-library'
                version = '1.0.0' // This can be pulled from a property/version file
				pom {
                    name = artifactId
                    description = 'Material Button And Icon Button'
                    url = 'https://github.com/debanikita'
                    
                    licenses {
                        // Example: Apache 2.0
                        license {
                            name = 'The Apache Software License, Version 2.0'
                            url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                        }
                    }
                    developers {
                        developer {
                            id = 'debanikita'
                            name = 'Debashis Sabar'
                            email = 'xxx@gmail.com'
                        }
                    }
                    scm {
                        connection = 'scm:git:github.com/debanikita'
                        developerConnection = 'scm:git:github.com/debanikita'
                        url = 'https://github.com/debanikita'
                    }
				}
            }
        }
        repositories {
			/*
            maven {
                // GitHub Packages URL structure: 
                // https://maven.pkg.github.com/OWNER/REPOSITORY
                name = "GitHubPackages"
                url = uri("https://maven.pkg.github.com/onedeba7/button")

                // Get credentials from environment variables for GitHub Actions
                credentials {
                    username = project.findProperty("GIT_ACTOR") ?: ""
                    password = project.findProperty("GIT_TOKEN") ?: ""
                }
            }
			*/
			maven {
            def releasesRepoUrl = layout.buildDirectory.dir('repos/releases')
            def snapshotsRepoUrl = layout.buildDirectory.dir('repos/snapshots')
            url = version.endsWith('SNAPSHOT') ? snapshotsRepoUrl : releasesRepoUrl
        }
        }
    }

/*
    
    signing {
        sign publishing.publications.release
    }
    */
}
